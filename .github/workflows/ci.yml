name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: engine
      - name: Lint
        run: uv run ruff check .
        working-directory: engine
      - name: Test
        run: uv run pytest -v
        working-directory: engine
